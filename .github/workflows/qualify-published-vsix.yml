name: Qualify published Nix Workshop VSIX
on:
  workflow_dispatch:
  push:
    branches: [ci/vsix-release-qualification-20261021]
    paths: [.github/workflows/qualify-published-vsix.yml]
permissions:
  contents: read
jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download and inspect pinned beta
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib, json, pathlib, urllib.request, zipfile, sys
          tag = "v0.0.4-beta"
          name = "nix-workshop-0.0.4.vsix"
          expected_sha = "3b86f3b14263b56af06a22b20cff3a86b30e911321b9d6c794296c0875d24cae"
          url = f"https://github.com/BillyMixNix/nix-workshop-releases/releases/download/{tag}/{name}"
          report = {"tag": tag, "asset": name, "checks": [], "status": "FAIL"}
          try:
              req = urllib.request.Request(url, headers={"User-Agent": "NixWorkshop-qualification"})
              with urllib.request.urlopen(req, timeout=30) as response:
                  data = response.read(30_000_001)
              assert len(data) <= 30_000_000, "Oversized asset"
              actual_sha = hashlib.sha256(data).hexdigest()
              assert actual_sha == expected_sha, f"SHA256 mismatch: {actual_sha}"
              report["checks"].append("pinned SHA256")
              pathlib.Path(name).write_bytes(data)
              with zipfile.ZipFile(name) as archive:
                  members = archive.infolist()
                  assert members and len(members) < 10000, "Invalid archive size"
                  for member in members:
                      p = pathlib.PurePosixPath(member.filename)
                      assert not p.is_absolute() and ".." not in p.parts, "Unsafe path"
                  assert archive.testzip() is None, "Corrupt archive"
                  report["checks"].append("ZIP integrity and paths")
                  assert "extension/package.json" in archive.namelist(), "Missing package.json"
                  manifest = json.loads(archive.read("extension/package.json"))
                  assert manifest.get("name") == "nix-workshop", "Extension identity mismatch"
                  assert manifest.get("version") == "0.0.4", "Version mismatch"
                  main = manifest.get("main")
                  assert isinstance(main, str) and main.startswith("./"), "Missing/unsafe entrypoint"
                  target = pathlib.PurePosixPath("extension") / main[2:]
                  assert ".." not in target.parts and str(target) in archive.namelist(), "Entrypoint missing"
                  report["checks"].append("extension identity and entrypoint")
              report["status"] = "PASS"
          except Exception as exc:
              report["error"] = str(exc)
          pathlib.Path("qualification-report.json").write_text(json.dumps(report, indent=2))
          print(json.dumps(report, indent=2))
          sys.exit(0 if report["status"] == "PASS" else 1)
          PY
      - name: Upload qualification report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qualification-report
          path: qualification-report.json
